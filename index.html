<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Entry Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 sm:p-8 flex items-center justify-center min-h-screen">
  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-xl">
      <h1 class="text-3xl sm:text-4xl font-bold text-center text-gray-800 mb-6">Entry Tracker</h1>

      <!-- Message Box -->
      <div id="message-box" class="hidden p-2 mb-4 text-sm rounded"></div>

      <!-- User ID + Loading -->
      <div class="mb-4 text-center">
          <p id="user-id-display" class="text-sm font-mono text-gray-600 mb-2 p-2 bg-gray-100 rounded-lg shadow-inner hidden"></p>
      </div>
      <div id="loading-spinner" class="text-center hidden">
          <div class="animate-spin inline-block w-8 h-8 border-4 border-indigo-500 border-dotted rounded-full"></div>
          <p class="text-gray-500 mt-2">Connecting to database...</p>
      </div>

      <!-- Main Content -->
      <div id="content-container" class="hidden">
          <!-- Entry Form -->
          <form id="entry-form" class="mb-4">
              <label class="block mb-2 text-gray-700 font-medium">Select Person</label>
              <select id="person-name" class="border rounded p-2 w-full mb-2">
                  <option value="Person1">Person1</option>
                  <option value="Person2">Person2</option>
              </select>

              <label class="block mb-1 text-gray-700">From Date</label>
              <div class="flex space-x-2 mb-2">
                  <input type="date" id="from-date" class="border rounded p-2 flex-1">
                  <button type="button" id="from-date-voice-btn" class="px-3 py-2 bg-gray-200 rounded">🎤</button>
              </div>

              <label class="block mb-1 text-gray-700">To Date</label>
              <div class="flex space-x-2 mb-4">
                  <input type="date" id="to-date" class="border rounded p-2 flex-1">
                  <button type="button" id="to-date-voice-btn" class="px-3 py-2 bg-gray-200 rounded">🎤</button>
              </div>

              <div class="mt-4 flex space-x-2">
                  <button type="submit" id="submit-button" class="bg-indigo-600 text-white px-4 py-2 rounded">Add Entry</button>
                  <button type="button" id="cancel-edit-button" class="hidden bg-gray-300 px-4 py-2 rounded">Cancel</button>
              </div>
          </form>

          <!-- Action Buttons -->
          <div class="flex space-x-2 mb-4">
              <button id="clear-button" class="bg-red-600 text-white px-4 py-2 rounded">Clear All</button>
              <button id="sync-button" class="bg-blue-600 text-white px-4 py-2 rounded">Sync</button>
          </div>

          <!-- Entries List -->
          <div id="entries-list" class="mt-4 space-y-2"></div>

          <!-- Progress Section -->
          <div class="mt-6">
              <p id="progress-text" class="text-gray-700"></p>
              <div class="w-full bg-gray-200 rounded-full h-2.5 mt-1">
                  <div id="progress-bar" class="h-2.5 rounded-full bg-indigo-600 w-0"></div>
              </div>
              <p class="mt-2 text-sm">Total: <span id="total-days">0 Days</span>, Remaining: <span id="remaining-days">1035 Days</span></p>
          </div>
      </div>
  </div>

  <!-- Firebase + App Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "canada-tracker.firebaseapp.com",
      projectId: "canada-tracker",
      storageBucket: "canada-tracker.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const messageBox = document.getElementById('message-box');
    const contentContainer = document.getElementById('content-container');
    const loadingSpinner = document.getElementById('loading-spinner');

    // Fake loading simulation
    loadingSpinner.classList.remove("hidden");
    setTimeout(() => {
      loadingSpinner.classList.add("hidden");
      contentContainer.classList.remove("hidden");
      messageBox.textContent = "Connected successfully ✅";
      messageBox.classList.remove("hidden", "bg-red-100", "text-red-600");
      messageBox.classList.add("bg-green-100", "text-green-700");
    }, 1500);
  </script>
</body>
</html>
